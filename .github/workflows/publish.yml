name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      # npm CLI for tests on Node, trusted-publishing OIDC exchange and provenance signing.
      # Trusted Publishing needs npm CLI 11.5.1+; Node 22 LTS ships with 10.x.
      # No registry-url on setup-node: its placeholder authToken blocks OIDC.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node --test test/wip.test.ts
      - run: bun run build
      - run: npm install -g npm@latest
      # Auth via npm Trusted Publishing. Configure on npmjs.com first:
      # https://www.npmjs.com/package/@cinderblock/node-git-wip/access → Trusted Publisher
      # → GitHub Actions / cinderblock / node-git-wip / publish.yml / (no environment).
      - run: npm publish --provenance --access public
